<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Расписание на неделю</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091523;color:#eff6ff;font-family:Arial,Helvetica,sans-serif}#screen{width:100vw;height:100vh;padding:12px 17px;display:flex;flex-direction:column;gap:9px}header{display:flex;justify-content:space-between;align-items:center;min-height:65px}h1{margin:0;font-size:32px;letter-spacing:1px}.subtitle{color:#a7c9e5;font-size:19px;margin-top:3px}#clock{font-size:36px;font-weight:700}.schedule{flex:1;min-height:0;display:grid;grid-template-rows:47px repeat(8,minmax(0,1fr));gap:4px}.schedule-row{display:grid;grid-template-columns:100px repeat(6,minmax(0,1fr));gap:4px;min-height:0}.head-cell{background:#1d4768;color:#d8f2ff;font-weight:bold;display:flex;justify-content:center;align-items:center;font-size:18px;border-radius:5px}.group-name{background:#1d4768;border-radius:5px;display:flex;justify-content:center;align-items:center;font-size:24px;font-weight:800}.day-cell{background:#142c43;border:1px solid #2a4b66;border-radius:5px;overflow:hidden;padding:3px 5px;display:flex;flex-direction:column;justify-content:flex-start;gap:1px}.entry{font-size:clamp(10px,.70vw,14px);line-height:1.12;display:flex;align-items:center;gap:3px;border-bottom:1px solid #29435a;padding:1px 0;min-height:0;flex:none;white-space:nowrap;overflow:hidden;height:17px}.entry:last-child{border:0}.entry-body{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.more{font-size:12px;color:#ffd98b;font-weight:700;flex:none;padding-top:2px}.num{font-weight:800;color:#69cfff;flex:none}.subject{font-weight:600;white-space:nowrap}.meta{color:#c2d2e0;font-size:.88em}.subgroup{color:#ffdc83;font-weight:800}.empty{color:#55748b;text-align:center;padding-top:12px}.week-controls{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}.week-controls button{background:#23465e;color:#e7f6ff;border:1px solid #47718c;border-radius:5px;font:600 12px Arial,sans-serif;padding:4px 7px;cursor:pointer;min-height:24px}.week-controls button:hover,.week-controls button:focus-visible{background:#386a8b}.week-controls button:focus-visible{outline:2px solid #a8e9ff}.week-controls button:disabled{opacity:.4;cursor:default}footer{height:26px;display:flex;justify-content:space-between;align-items:center;color:#a8c4d8;font-size:16px}.progress{width:26%;height:5px;border-radius:4px;background:#284760;overflow:hidden}.bar{height:100%;background:#55c8ff;animation:fill 5s linear infinite}@keyframes fill{from{width:0}to{width:100%}}
</style></head><body><div id="screen"><header><div><h1>РАСПИСАНИЕ ЗАНЯТИЙ НА НЕДЕЛЮ</h1><div class="subtitle" id="week"></div></div><div class="week-controls" aria-label="Выбор недели"><button id="prev" type="button" title="Предыдущая неделя">◀</button><button id="today" type="button">Текущая</button><button id="next" type="button" title="Следующая неделя">▶</button></div><div id="clock"></div></header><main class="schedule" id="grid"></main><footer><span id="page"></span><div class="progress"><div class="bar" id="bar"></div></div><span id="updated"></span></footer></div><script>
const $=id=>document.getElementById(id),perPage=8,names=['ПОНЕДЕЛЬНИК','ВТОРНИК','СРЕДА','ЧЕТВЕРГ','ПЯТНИЦА','СУББОТА'];let data={groups:[],times:[]},page=0,stamp='',selectedDate=null;
const isoLocal=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const parseLocal=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const initial=new URLSearchParams(location.search).get('date');
selectedDate=(initial&&/^\d{4}-\d{2}-\d{2}$/.test(initial)&&!Number.isNaN(parseLocal(initial).getTime()))?initial:isoLocal(new Date());
function chooseDate(date){selectedDate=date;stamp='';page=0;const url=new URL(location.href);url.searchParams.set('date',date);history.replaceState(null,'',url);refresh()}
$('prev').addEventListener('click',()=>{const d=parseLocal(selectedDate);d.setDate(d.getDate()-7);chooseDate(isoLocal(d))});
$('next').addEventListener('click',()=>{const d=parseLocal(selectedDate);d.setDate(d.getDate()+7);chooseDate(isoLocal(d))});
$('today').addEventListener('click',()=>chooseDate(isoLocal(new Date())));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shortDate=s=>s?s.split('-').reverse().join('.'):'';
function render(){const count=Math.max(1,Math.ceil(data.groups.length/perPage));page%=count;const groups=data.groups.slice(page*perPage,(page+1)*perPage);let html='<div class="schedule-row"><div class="head-cell">ГРУППА</div>'+names.map(n=>`<div class="head-cell">${n}</div>`).join('')+'</div>';for(const g of groups){html+='<div class="schedule-row"><div class="group-name">'+esc(g.name)+'</div>';for(let day=1;day<=6;day++){let lessons=g.days?.[String(day)]||[];html+='<div class="day-cell">'+(lessons.length?lessons.slice(0,5).map(l=>`<div class="entry" title="${esc(l.hour+'. '+(l.subject||'Занятие')+(l.subgroup?' п/г '+l.subgroup:'')+(l.room?' каб. '+l.room:''))}"><span class="num">${esc(l.hour)}.</span><div class="entry-body"><span class="subject">${esc(l.subject||'Занятие')}</span> ${l.subgroup?`<span class="subgroup">[п/г ${esc(l.subgroup)}]</span>`:''} <span class="meta">${esc(l.room?('к. '+l.room):'')}</span></div></div>`).join('')+(lessons.length>5?`<div class="more">+ ещё ${lessons.length-5} занятий</div>`:''):'<span class="empty">—</span>')+'</div>'}html+='</div>'}for(let i=groups.length;i<perPage;i++)html+='<div class="schedule-row"><div class="group-name"></div>'+Array(6).fill('<div class="day-cell"></div>').join('')+'</div>';$('grid').innerHTML=html;$('page').textContent=`Страница ${page+1} / ${count} · 8 групп на странице`;$('week').textContent=`${shortDate(data.week_start)} — ${shortDate(data.week_end)}`;$('updated').textContent=data.updated?'Обновлено '+data.updated.replace('T',' '):'';$('bar').style.animation='none';void $('bar').offsetWidth;$('bar').style.animation='fill 5s linear infinite'}
async function refresh(){const date=selectedDate;try{const r=await fetch('/api/week?date='+date,{cache:'no-store'});if(!r.ok)throw Error(r.status);const v=await r.json();if(date!==selectedDate)return;const next=JSON.stringify(v);if(next!==stamp){stamp=next;data=v;page=0;render()}}catch(e){$('updated').textContent='Нет связи с сервером'}}
setInterval(()=>{page++;render()},5000);setInterval(refresh,30000);setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'})},1000);refresh();
</script></body></html>
